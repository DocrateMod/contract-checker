<!DOCTYPE html>

<head>

<title>Проверка договоров</title>
<style>
:root{color-scheme:light;--text:#0b1f33;--navy:#0f2a52;--mut:#51647a;--sky:#1d6fe0;--indigo:#4f46e5;--teal:#0d9488;--amber:#c2670a;--green:#15803d;--red:#c62828;--bm:#d3e0f2;--mono:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace;--h:clamp(26px,7.4vw,34px);--card:rgba(255,255,255,.82);--sh:0 8px 26px rgba(30,64,120,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
[hidden]{display:none!important}
html{background:#eef3fb;overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{margin:0;color:var(--text);font-family:Inter,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding:calc(98px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 42% at 92% 0,rgba(99,102,241,.28),transparent 70%),radial-gradient(55% 40% at 0 22%,rgba(56,189,248,.34),transparent 70%),radial-gradient(65% 45% at 100% 100%,rgba(45,212,191,.26),transparent 70%),linear-gradient(180deg,#f6f9ff,#e6eefb)}
#hd{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:rgba(246,249,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(15,42,82,.07)}
#hl{flex:1;min-width:0}
#sec{display:block;max-width:100%;margin:0 0 2px;padding:6px 0;background:none;border:0;font-family:inherit;font-size:16px;font-weight:700;color:var(--navy);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#segs{display:flex;gap:6px}
.seg{position:relative;flex:1;height:26px;padding:0;background:none;border:0;cursor:pointer}
.seg::before,.seg i{content:"";position:absolute;left:0;top:10px;height:6px;border-radius:3px}
.seg::before{right:0;background:#cbd8ea}
.seg.cur::before{background:#aac6f2}
.seg i{background:linear-gradient(90deg,var(--teal),var(--sky));transition:width .35s ease}
.seg:disabled{cursor:default}
#cnt{flex:none;min-width:54px;padding:5px 12px;border-radius:12px;background:#0b1f33;color:#5eead4;text-align:center;font:700 26px var(--mono);letter-spacing:.06em;box-shadow:0 4px 14px rgba(11,31,51,.25)}
#m{flex:1;width:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px;transition:opacity .15s ease,transform .15s ease}
#m.out-l{opacity:0;transform:translateX(-24px)}
#m.out-r{opacity:0;transform:translateX(24px)}
#m.in-r{animation:inr .3s cubic-bezier(.2,.8,.2,1)}
#m.in-l{animation:inl .3s cubic-bezier(.2,.8,.2,1)}
@keyframes inr{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
h1{margin:0;text-align:center;font-size:var(--h);line-height:1.18;font-weight:700;letter-spacing:-.01em;color:var(--navy);text-wrap:balance;overflow-wrap:break-word;hyphens:none}
.ex{text-align:center;font-size:clamp(20px,5.8vw,26px);line-height:1.3;color:#3d5873;text-wrap:balance;overflow-wrap:break-word}
.warn{text-align:center;background:linear-gradient(135deg,#c62828,#a31515);border-radius:20px;padding:14px;color:#fff;font-size:clamp(20px,6vw,26px);font-weight:800;letter-spacing:.04em;text-wrap:balance;box-shadow:0 10px 24px rgba(198,40,40,.3)}
.circle{width:min(70vw,290px);height:min(70vw,290px);flex:none;border-radius:50%;border:14px solid #c4d3e6;background:var(--card);margin:6px auto;padding:0;display:flex;align-items:center;justify-content:center;color:#7d93ad;font:600 72px var(--mono);box-shadow:var(--sh)}
button.circle{cursor:pointer}
.circle.on{border-color:#22a559;box-shadow:0 10px 34px rgba(34,165,89,.25)}
.circle svg{width:60%;height:60%}
.circle.on svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .35s .05s ease-out forwards}
.gauge{--p:0%;width:104px;height:104px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 34px var(--mono);color:var(--navy);background:radial-gradient(closest-side,#fff 80%,transparent 82%),conic-gradient(var(--sky) var(--p),#cbd8ea 0);box-shadow:var(--sh)}
.btn{width:100%;min-height:84px;padding:14px 18px;font-family:inherit;font-size:var(--h);font-weight:700;line-height:1.18;letter-spacing:-.01em;color:var(--navy);background:var(--card);border:1.5px solid var(--bm);border-radius:24px;box-shadow:var(--sh);text-wrap:balance;overflow-wrap:break-word;cursor:pointer}
.btn:hover{border-color:var(--sky)}
.btn:active{transform:scale(.985)}
.btn.sel{border-color:var(--sky);background:#dbe9ff}
.opt-yes{border-left:8px solid var(--teal)}
.opt-no{border-left:8px solid var(--amber)}
.btn.go{color:#fff;border:0;background:linear-gradient(135deg,#1d6fe0,#4f46e5);box-shadow:0 12px 26px rgba(79,70,229,.32)}
.btn.sec{min-height:56px;font-size:21px;font-weight:600;color:var(--sky);box-shadow:none;border-radius:18px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
input{width:100%;min-height:80px;padding:10px 18px;font-family:inherit;font-size:var(--h);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);background:rgba(255,255,255,.92);border:1.5px solid var(--bm);border-radius:20px;box-shadow:var(--sh)}
input::placeholder{color:#8095aa;font-weight:600}
input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(29,111,224,.2)}
input.bad{border-color:var(--red)}
label{display:block;font-size:18px;letter-spacing:.02em;color:var(--mut);margin:0 0 6px 4px}
.res{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:4px 18px;box-shadow:var(--sh);font-size:clamp(18px,5vw,22px);line-height:1.4}
.res:empty{display:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid #dbe5ef}
.row:last-of-type{border-bottom:0}
.row span{color:var(--mut)}
.row b{font-size:1.3em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ok,.no,.wait,.alert{display:block;margin:10px 0 8px;padding:12px 14px;border-radius:14px;font-weight:800;letter-spacing:.02em;text-wrap:balance}
.ok{color:var(--green);background:rgba(21,128,61,.1);border:1px solid var(--green)}
.no,.alert{color:var(--red);background:rgba(198,40,40,.08);border:1px solid var(--red)}
.wait{color:var(--amber);background:rgba(194,103,10,.1);border:1px solid var(--amber)}
.alert{font-size:22px}
.push,.btn.go{margin-top:auto}
.push~.back,.btn.go~.back{margin-top:0}
.back{align-self:flex-start;margin-top:auto;min-height:48px;padding:8px 20px;background:rgba(255,255,255,.6);border:1px solid var(--bm);border-radius:24px;color:#3d5873;font:inherit;font-size:19px;cursor:pointer}
#sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(11,31,51,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sbox{width:100%;max-width:620px;max-height:82dvh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));background:#fff;border-radius:28px 28px 0 0;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-t{padding:0 6px 4px;font-weight:700;color:var(--mut)}
.si{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:12px 18px;border:1.5px solid var(--bm);border-radius:20px;background:#f4f8ff;font-family:inherit;font-size:22px;font-weight:700;color:var(--navy);text-align:left;cursor:pointer}
.si small{font-size:15px;font-weight:600;color:var(--mut);white-space:nowrap}
.si.cur{border-color:var(--sky);background:#e1edff}
.si:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){#m,#m.in-r,#m.in-l,#sbox,.circle.on svg path,.seg i{animation:none;transition:none}.circle.on svg path{stroke-dashoffset:0}}
</style>
</head>
<body>
<header id="hd"><div id="hl"><button id="sec" type="button"></button><div id="segs"></div></div><div id="cnt">0</div></header>
<div id="sheet" hidden><div id="sbox"></div></div>
<main id="m"></main>
<script>
'use strict';
/* ---------- Даты (всё в UTC, чтобы не было сдвига из-за часового пояса) ---------- */
// Нерабочие / исключённые даты: [месяц, день], год любой
const HOLIDAYS = [[1,2],[1,3],[1,9],[1,10],[2,20],[2,21],[5,1],[5,2]];
const pad = n => String(n).padStart(2,'0');
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (d,n) => new Date(d.getTime() + n*86400000);
const fmtDate = d => pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+'.'+d.getUTCFullYear();
const isHoliday = d => HOLIDAYS.some(([m,dd]) => d.getUTCMonth()+1===m && d.getUTCDate()===dd);
const isWorkday = d => { const w = d.getUTCDay(); return w!==0 && w!==6 && !isHoliday(d); };

/* >>> ПРАВИЛО РАСЧЁТА ДАТЫ ОКОНЧАНИЯ (можно менять здесь) <<<
   Занятия раз в неделю. Если дата занятия попала в HOLIDAYS, оно не засчитывается
   и переносится на следующую неделю (счёт идёт дальше с шагом 7 дней). */
function calcEndDate(startDate, lessons){
  let d = startDate, done = 0, last = null;
  while (done < lessons){
    if (!isHoliday(d)){ done++; last = d; }
    d = addDays(d,7);
  }
  return last;
}
// Дата оплаты (маткапитал): +7 календарных дней, затем +15 рабочих дней
function calcPayDate(startDate){
  const mid = addDays(startDate,7);
  let d = mid, left = 15;
  while (left > 0){ d = addDays(d,1); if (isWorkday(d)) left--; }
  return {mid, end:d};
}

/* ---------- Деньги (в копейках, без ошибок float) ---------- */
function kop(s){
  s = String(s||'').replace(/\s/g,'').replace(',','.');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const [a,b=''] = s.split('.');
  return Number(a)*100 + Number((b+'00').slice(0,2));
}
const rub = k => (k/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽';

/* ---------- Описание шагов ---------- */
const MONTHS = ['Сентябрь','Октябрь','Ноябрь','Декабрь','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август'];
const hrs = v => v.q2==='Короткий' ? 36 : 68;
const mat = v => v.q65==='Да';   // маткап: только 9.1
const ord = v => v.q65==='Нет';  // обычная оплата: 7, 8, 9
const C = (id,title) => ({id,t:'check',title});
const Q = (id,title,opts) => ({id,t:'choice',title,opts});
const T = (id,title,ex) => ({id,t:'check',title,ex:ex||''});
const STEPS = [
  C('c0','БЮДЖЕТНОЕ НА АВТОНОМНОЕ'),
  Q('q1','Новый договор?',['Да','Нет']),
  Q('q2','Длинный или короткий?',['Длинный','Короткий']),
  C('c3', v => hrs(v)+' часов'),
  {id:'d4',t:'date',title:'Дата начала занятий'},
  C('c5','Начало периода оказания услуг'),
  C('c6','Конец периода оказания услуг'),
  Q('q65','МАТКАП?',['Да','Нет']),
  {id:'m7',t:'months',title:'ОПЛАТА ПОМЕСЯЧНО ПРОВЕРКА',show:ord},
  {id:'c8',t:'check',title:'Сумма оплаты проверка',show:ord},
  {id:'pd',t:'paydate',title:'Дата оплаты',show:mat},
  T('t10','Фамилия инициалы','Смирнов К.П.'),
  T('t11','Заказчик','Куликов Пётр Филатович'),
  T('t12','ФАМИЛИЯ'), T('t13','ИМЯ'), T('t14','ОТЧЕСТВО'),
  T('t15','Телефон','+7 990 992 54 54'),
  T('t16','Дата рождения','23.08.1998'),
  T('t17','Паспорт','4565 89 76 23'),
  T('t18','СЕРИЯ','4565'), T('t19','НОМЕР','89 76 23'),
  T('t20','Выдан','23.08.1998'),
  C('c21','Выдан «ЗАГУГЛИТЬ РЕАЛЬНО КАК ПИШЕТСЯ»'),
  C('c22','Выдан «Проверить весь КАПС и №»'),
  T('t23','Адрес ИНДЕКС','105 005'),
  T('t24','Город и тд'),
  T('t25','КВАРТИРА'),
  T('t26','Ребёнок','Куликов Пётр Филатович'),
  T('t27','ФАМИЛИЯ'), T('t28','ИМЯ'), T('t29','ОТЧЕСТВО'),
  T('t30','Дата рождения','23.08.1998'),
  T('t31','Паспорт','4565 89 76 23'),
  T('t32','СЕРИЯ','4565'), T('t33','НОМЕР','89 76 23'),
  T('t34','Выдан','23.08.1998'),
  C('c35','Выдан «ЗАГУГЛИТЬ РЕАЛЬНО КАК ПИШЕТСЯ»'),
  C('c36','Выдан «Проверить весь КАПС и №»'),
  C('c37','УБРАТЬ НОМЕР'),
  T('t38','Адрес ИНДЕКС','105 005'),
  T('t39','Город и тд'),
  T('t40','КВАРТИРА'),
  {id:'h41',t:'hours',title:'ЧАСЫ'},
  T('t42','Расписание','суббота или воскресенье')
];

/* ---------- Секции: начало каждой секции задаётся id первого шага ---------- */
const SECTIONS = [['Основа','c0'],['Период и оплата','c5'],['Заказчик','t10'],['Ребёнок','t26'],['Часы и расписание','h41']]
  .map(([name,id]) => ({name, i: STEPS.findIndex(x => x.id===id)}));

/* ---------- Состояние и хранилище ---------- */
const KS = 'dc_state', KC = 'dc_count';
const fresh = () => ({cur:0, v:{}, counted:false, max:0});
let S = fresh();  // данные договора живут только в памяти и не сохраняются
try { localStorage.removeItem(KS); } catch(e){}  // удаляем старые сохранённые данные
const today = () => { const n = new Date(); return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate()); };
function getCount(){
  try { const c = JSON.parse(localStorage.getItem(KC)); if (c && c.d===today()) return c.n; } catch(e){}
  return 0;
}
function incCount(){ try { localStorage.setItem(KC, JSON.stringify({d:today(), n:getCount()+1})); } catch(e){} }
const showCount = () => { document.getElementById('cnt').textContent = getCount(); };

/* ---------- Навигация (видимость шагов считается по текущим ответам) ---------- */
const vis = i => !STEPS[i].show || STEPS[i].show(S.v);
let navBusy = false;
// Короткий выезд текущего экрана, смена шага, въезд следующего (dir: 1 вперёд, -1 назад)
function transition(dir, change){
  if (navBusy) return; navBusy = true;
  M.classList.remove('in-r','in-l'); M.classList.add(dir > 0 ? 'out-l' : 'out-r');
  setTimeout(() => { change(); DIR = dir; render(); navBusy = false; }, 150);
}
function next(){ let i = S.cur+1; while (i < STEPS.length && !vis(i)) i++; transition(1, () => { S.cur = i; }); }
function hasPrev(){ for (let i = S.cur-1; i >= 0; i--) if (vis(i)) return true; return false; }
function prev(){ let i = S.cur-1; while (i >= 0 && !vis(i)) i--; if (i >= 0) transition(-1, () => { S.cur = i; }); }

// Секции: диапазон шагов, видимые шаги, переход
const secEnd = k => k+1 < SECTIONS.length ? SECTIONS[k+1].i : STEPS.length;
const secSteps = k => { const a = []; for (let i = SECTIONS[k].i; i < secEnd(k); i++) if (vis(i)) a.push(i); return a; };
const sectionOf = i => { let k = 0; SECTIONS.forEach((x,n) => { if (i >= x.i) k = n; }); return k; };
const reachable = k => { const f = secSteps(k)[0]; return f !== undefined && f <= (S.max || 0); };
function jump(k){
  const t = secSteps(k)[0];
  if (t === undefined || t === S.cur || !reachable(k)) return;
  transition(t > S.cur ? 1 : -1, () => { S.cur = t; });   // введённые данные сохраняются в S.v
}
function renderHeader(){
  const fin = S.cur >= STEPS.length, cur = sectionOf(Math.min(S.cur, STEPS.length-1));
  const segs = document.getElementById('segs'); segs.innerHTML = '';
  let label = 'Готово';
  SECTIONS.forEach((sc,k) => {
    const idx = secSteps(k), done = idx.filter(i => i < S.cur).length;
    const b = el('button','seg'+(k===cur && !fin ? ' cur' : ''), null, segs);
    b.setAttribute('aria-label', sc.name); b.disabled = !reachable(k);
    el('i', null, null, b).style.width = Math.round(100*done/idx.length)+'%';
    b.onclick = () => jump(k);
    if (k === cur && !fin) label = sc.name+' · '+(done+1)+'/'+idx.length+'  ▾';
  });
  document.getElementById('sec').textContent = label;
}
function openSheet(){
  const sh = document.getElementById('sheet'), box = document.getElementById('sbox');
  const fin = S.cur >= STEPS.length, cur = sectionOf(Math.min(S.cur, STEPS.length-1));
  box.innerHTML = ''; el('div','sh-t','Разделы',box);
  SECTIONS.forEach((sc,k) => {
    const idx = secSteps(k), isDone = idx.every(i => i < S.cur), isCur = k === cur && !fin;
    const b = el('button','si'+(isCur ? ' cur' : ''), sc.name, box);
    el('small', null, isCur ? 'сейчас' : isDone ? '✓ пройдено' : '', b);
    b.disabled = !reachable(k);
    b.onclick = () => { sh.hidden = true; jump(k); };
  });
  sh.hidden = false;
}
document.getElementById('sec').onclick = openSheet;
document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') e.target.hidden = true; };

/* ---------- Помощники интерфейса ---------- */
let M, DIR = 0, POS = 0, TOTAL = 1;
function el(tag, cls, text, parent){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  (parent || M).appendChild(e);
  return e;
}
const titleOf = st => typeof st.title === 'function' ? st.title(S.v) : st.title;
const h1 = st => el('h1', null, titleOf(st));
function go(label, fn){ const b = el('button','btn go',label); b.onclick = fn; return b; }
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const line = (box, label, val) => { box.insertAdjacentHTML('beforeend','<div class="row"><span>'+label+'</span><b>'+val+'</b></div>'); };

const gauge = () => el('div','gauge',String(POS+1)).style.setProperty('--p', Math.round(100*(POS+1)/TOTAL)+'%');

/* ---------- Отрисовщики типов экранов ---------- */
const R = {
  // Тип А: индикатор сверху, вопрос под ним
  check(st){
    const on = !!S.v[st.id];
    const b = el('button','circle'+(on?' on':''));
    b.setAttribute('aria-label','Подтвердить');
    if (on) b.innerHTML = TICK; else b.textContent = String(POS+1);
    h1(st);
    if (st.ex) el('div','ex',st.ex);
    let busy = false;
    b.onclick = () => {
      if (busy) return; busy = true;
      S.v[st.id] = true;
      b.classList.add('on'); b.innerHTML = TICK;
      setTimeout(next, 300);
    };
  },
  // Тип Б
  choice(st){
    gauge(); h1(st);
    st.opts.forEach(o => {
      const cls = o==='Да' ? ' opt-yes' : o==='Нет' ? ' opt-no' : '';
      const b = el('button','btn'+cls+(S.v[st.id]===o?' sel':'')+(o===st.opts[0]?' push':''), o);
      b.onclick = () => { S.v[st.id] = o; next(); };
    });
  },
  // Пункт 4: дата начала и расчёт даты окончания
  date(st){
    el('div','warn','⚠ НЕ ДЛЯ ОГЭ / ЕГЭ');
    h1(st);
    el('label',null,'Дата начала'); const i = el('input'); i.type = 'date'; i.value = S.v.start || '';
    const r = el('div','res');
    const b = go('Подтвердить', next);
    const u = () => {
      S.v.start = i.value; b.disabled = !i.value; r.innerHTML = '';
      if (i.value){
        const n = hrs(S.v), s = parseISO(i.value);
        line(r,'Начало',fmtDate(s)); line(r,'Занятий',n); line(r,'Окончание',fmtDate(calcEndDate(s,n)));
      }
    };
    i.oninput = u; i.onchange = u; u();
  },
  // Пункт 7: оплата по месяцам
  months(st){
    gauge(); h1(st);
    const m = S.v.months = S.v.months || {};
    const sum = el('div','res');
    const upd = () => {
      let t = 0; MONTHS.forEach(n => { const k = kop(m[n]); if (k) t += k; });
      sum.innerHTML = ''; line(sum,'Всего',rub(t));
    };
    MONTHS.forEach(n => {
      const w = el('div'); el('label',null,n,w);
      const i = el('input',null,null,w); i.inputMode = 'decimal'; i.value = m[n] || '';
      i.oninput = () => { m[n] = i.value; i.classList.toggle('bad', i.value.trim()!=='' && kop(i.value)===null); upd(); };
    });
    M.appendChild(sum); upd();
    go('Подтвердить', next);
  },
  // Пункт 9.1: дата оплаты
  paydate(st){
    gauge(); h1(st);
    const r = el('div','res');
    if (S.v.start){
      const s = parseISO(S.v.start), p = calcPayDate(s);
      line(r,'Начало занятий',fmtDate(s)); line(r,'+7 календарных дней',fmtDate(p.mid)); line(r,'+15 рабочих дней',fmtDate(p.end));
    } else el('div','alert','Не указана дата начала занятий (пункт 4)');
    go('Подтвердить дату оплаты', next);
  },
  // Пункт 41: калькулятор часов (можно вводить частями, сумма сравнивается с 36 / 68)
  hours(st){
    gauge(); h1(st);
    const exp = hrs(S.v), H = S.v.hours = S.v.hours || [];
    el('label',null,'Часы'); const i = el('input'); i.inputMode = 'decimal'; i.placeholder = 'Часы';
    const addH = () => {
      const n = Number(i.value.replace(',','.'));
      if (i.value.trim()==='' || isNaN(n) || n <= 0){ i.classList.add('bad'); return; }
      H.push(n); render(); M.querySelector('input').focus();
    };
    i.onkeydown = e => { if (e.key==='Enter') addH(); };
    i.oninput = () => i.classList.remove('bad');
    el('button','btn','Добавить').onclick = addH;
    const r = el('div','res');
    H.forEach((n,k) => line(r,(k+1)+'.',n));
    const tot = Math.round(H.reduce((a,n) => a+n, 0)*100)/100;
    line(r,'Сумма часов',tot); line(r,'Ожидается',exp);
    r.insertAdjacentHTML('beforeend', !H.length ? '<span class="wait">⏳ ТРЕБУЕТ ПРОВЕРКИ</span>' : tot===exp ? '<span class="ok">✓ ПРОВЕРЕНО</span>' : '<span class="no">⚠ НЕ СОВПАДАЕТ · разница '+Math.round(Math.abs(tot-exp)*100)/100+'</span>');
    const del = el('button','btn sec','Удалить последнее'); del.disabled = !H.length;
    del.onclick = () => { H.pop(); render(); };
    const b = go('Далее', next); b.disabled = !H.length;
  }
};

/* ---------- Экран завершения ---------- */
function renderDone(){
  // Счётчик растёт один раз за договор: флаг counted хранится в состоянии
  if (!S.counted){ S.counted = true; incCount(); }
  el('div','circle on').innerHTML = TICK;
  el('h1',null,'ДОГОВОР ПРОВЕРЕН');
  el('div','ex','Все этапы выполнены');
  el('button','btn go','Начать новый договор').onclick = () => { S = fresh(); DIR = 1; render(); };
}

function render(){
  M = document.getElementById('m');
  M.className = ''; M.innerHTML = '';
  if (DIR){ void M.offsetWidth; M.className = DIR > 0 ? 'in-r' : 'in-l'; DIR = 0; }
  S.max = Math.max(S.max || 0, S.cur);
  const vs = STEPS.map((x,i) => i).filter(vis);          // видимые шаги выбранной ветки
  POS = vs.filter(i => i < S.cur).length; TOTAL = vs.length;
  if (S.cur >= STEPS.length) renderDone();
  else { const st = STEPS[S.cur]; R[st.t](st); }
  if (hasPrev()) el('button','back','← Назад').onclick = prev;
  renderHeader(); showCount(); window.scrollTo(0,0);
}
render();
</script>
